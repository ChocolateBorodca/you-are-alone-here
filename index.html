<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Liminal Space Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: monospace; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #8a1a1a; text-align: center; font-size: 20px; cursor: pointer; background: rgba(0,0,0,0.9); padding: 30px; border: 1px solid #333; z-index: 10; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #555; font-size: 14px; pointer-events: none; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <b style="font-size:24px; color:#fff;">ВЫ ЗДЕСЬ ОДИН</b><br><br>
        Кликните, чтобы войти в Закулисье<br>
        <span style="font-size:14px; color:#777;">(Управление: WASD + Мышь)</span>
    </div>
    <div id="ui">Локация: Бесконечные коридоры</div>

    <script>
        // 1. Создание сцены и тумана Сайлент Хилла
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x060608);
        scene.fog = new THREE.FogExp2(0x060608, 0.18); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Освещение и Фонарик
        const ambientLight = new THREE.AmbientLight(0x0a0a0f); 
        scene.add(ambientLight);

        const flashlight = new THREE.SpotLight(0xfff3d1, 4, 18, Math.PI / 5, 0.5, 1);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // 3. Автоматическая генерация карты (без массивов)
        const wallMat = new THREE.MeshLambertMaterial({ color: 0xbfa36f });   // Стены
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x3d3023 });  // Пол
        const ceilingMat = new THREE.MeshLambertMaterial({ color: 0x222222 });// Потолок

        const mapSize = 24;
        const wallSize = 4;
        const mapData = [];

        // Генерируем сетку комнат математически
        for (let r = 0; r < mapSize; r++) {
            mapData[r] = [];
            for (let c = 0; c < mapSize; c++) {
                // Создаем границы лабиринта и случайные колоны/стены внутри
                let isWall = (r === 0 || r === mapSize - 1 || c === 0 || c === mapSize - 1);
                if (!isWall && r % 3 === 0 && c % 3 === 0 && Math.random() > 0.3) {
                    isWall = true; 
                }
                // Оставляем стартовую зону игрока абсолютно пустой
                if (r < 4 && c < 4) isWall = false;

                mapData[r][c] = isWall ? 1 : 0;
            }
        }

        // Строим 3D объекты по созданной сетке
        const wallGeo = new THREE.BoxGeometry(wallSize, wallSize, wallSize);
        const floorGeo = new THREE.PlaneGeometry(wallSize, wallSize);

        for (let r = 0; r < mapSize; r++) {
            for (let c = 0; c < mapSize; c++) {
                const x = c * wallSize - (mapSize * wallSize) / 2;
                const z = r * wallSize - (mapSize * wallSize) / 2;

                if (mapData[r][c] === 1) {
                    const wall = new THREE.Mesh(wallGeo, wallMat);
                    wall.position.set(x, wallSize / 2, z);
                    scene.add(wall);
                } else {
                    const floor = new THREE.Mesh(floorGeo, floorMat);
                    floor.rotation.x = -Math.PI / 2;
                    floor.position.set(x, 0, z);
                    scene.add(floor);

                    const ceil = new THREE.Mesh(floorGeo, ceilingMat);
                    ceil.rotation.x = Math.PI / 2;
                    ceil.position.set(x, wallSize, z);
                    scene.add(ceil);
                }
            }
        }

        // Ставим игрока в пустой угол
        camera.position.set(
            1 * wallSize - (mapSize * wallSize) / 2, 
            1.7, 
            1 * wallSize - (mapSize * wallSize) / 2
        );

        // 4. Поворот камеры мышкой (Pointer Lock)
        const instructions = document.getElementById('instructions');
        instructions.addEventListener('click', () => { document.body.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => {
            instructions.style.display = document.pointerLockElement === document.body ? 'none' : 'block';
        });

        let yaw = 0, pitch = 0;
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            yaw -= e.movementX * 0.0025;
            pitch -= e.movementY * 0.0025;
            pitch = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitch));
            camera.rotation.order = "YXZ";
            camera.rotation.set(pitch, yaw, 0);
        });

        // 5. Движение и физика столкновений
        const keys = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', (e) => { if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { if(e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false; });

        const speed = 0.06;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const changeX = Math.sin(yaw) * speed;
            const changeZ = Math.cos(yaw) * speed;
            const oldX = camera.position.x;
            const oldZ = camera.position.z;

            if (keys.w) { camera.position.x -= changeX; camera.position.z -= changeZ; }
            if (keys.s) { camera.position.x += changeX; camera.position.z += changeZ; }
            if (keys.a) { camera.position.x -= changeZ; camera.position.z += changeX; }
            if (keys.d) { camera.position.x += changeZ; camera.position.z -= changeX; }

            // Проверка коллизий со стенами
            const gridX = Math.floor((camera.position.x + (mapSize * wallSize) / 2 + wallSize / 2) / wallSize);
            const gridZ = Math.floor((camera.position.z + (mapSize * wallSize) / 2 + wallSize / 2) / wallSize);

            if (gridX >= 0 && gridX < mapSize && gridZ >= 0 && gridZ < mapSize) {
                if (mapData[gridZ][gridX] === 1) {
                    camera.position.x = oldX;
                    camera.position.z = oldZ;
                }
            }

            // Покачивание камеры при ходьбе
            if (keys.w || keys.s || keys.a || keys.d) {
                camera.position.y = 1.7 + Math.sin(clock.getElapsedTime() * 8) * 0.03;
            }

            // Направление фонарика
            flashlight.position.copy(camera.position);
            const targetVector = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            flashlight.target.position.copy(camera.position).add(targetVector);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
